services:
  - type: web
    name: emotion-detection-websocket
    env: python
    region: oregon
    plan: free
    buildCommand: "cd ml_server && pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "cd ml_server && python emotion_detector.py"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: PORT
        sync: false
